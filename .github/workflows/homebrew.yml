name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "checksums.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256_ARM=$(grep "aarch64-apple-darwin" checksums.txt | awk '{print $1}')
          SHA256_X86=$(grep "x86_64-apple-darwin" checksums.txt | awk '{print $1}')
          SHA256_LINUX=$(grep "x86_64-unknown-linux-gnu" checksums.txt | awk '{print $1}')

          cat > Formula/tdo.rb <<EOF
          class Tdo < Formula
            desc "Terminal based todo app for managing today's tasks with gentle reminders"
            homepage "https://github.com/Wildhoney/Tdo"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Wildhoney/Tdo/releases/download/v$VERSION/tdo-aarch64-apple-darwin.tar.gz"
                sha256 "$SHA256_ARM"
              else
                url "https://github.com/Wildhoney/Tdo/releases/download/v$VERSION/tdo-x86_64-apple-darwin.tar.gz"
                sha256 "$SHA256_X86"
              end
            end

            on_linux do
              url "https://github.com/Wildhoney/Tdo/releases/download/v$VERSION/tdo-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "$SHA256_LINUX"
            end

            def install
              bin.install "tdo"
            end

            test do
              assert_match "Tdo", shell_output("#{bin}/tdo --help")
            end
          end
          EOF

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tdo.rb
          git commit -m "chore: update homebrew formula for ${{ github.ref_name }}"
          git push
