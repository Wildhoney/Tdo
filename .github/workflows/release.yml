name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tdo-${{ matrix.target }}.tar.gz tdo
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdo-${{ matrix.target }}
          path: tdo-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum tdo-*.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tdo-*.tar.gz
            checksums.txt

      - name: Update Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256_ARM=$(grep "aarch64-apple-darwin" checksums.txt | awk '{print $1}')
          SHA256_X86=$(grep "x86_64-apple-darwin" checksums.txt | awk '{print $1}')
          SHA256_LINUX=$(grep "x86_64-unknown-linux-gnu" checksums.txt | awk '{print $1}')

          cat > Formula/tdo.rb <<EOF
          class Tdo < Formula
            desc "Terminal based todo app for managing today's tasks with gentle reminders"
            homepage "https://github.com/Wildhoney/Tdo"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Wildhoney/Tdo/releases/download/v$VERSION/tdo-aarch64-apple-darwin.tar.gz"
                sha256 "$SHA256_ARM"
              else
                url "https://github.com/Wildhoney/Tdo/releases/download/v$VERSION/tdo-x86_64-apple-darwin.tar.gz"
                sha256 "$SHA256_X86"
              end
            end

            on_linux do
              url "https://github.com/Wildhoney/Tdo/releases/download/v$VERSION/tdo-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "$SHA256_LINUX"
            end

            def install
              bin.install "tdo"
            end

            test do
              assert_match "Tdo", shell_output("#{bin}/tdo --help")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tdo.rb
          git diff --cached --quiet || git commit -m "chore: update homebrew formula for v$VERSION"
          git push origin main
